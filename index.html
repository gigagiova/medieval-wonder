<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medieval Wonder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050608; color: #d8c9a8; font-family: 'IM Fell English', Georgia, serif; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem;
    background: radial-gradient(ellipse at center, rgba(10,9,8,0.55), rgba(3,3,4,0.92)); cursor: pointer; transition: opacity 0.8s; text-align: center; padding: 16px; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { font-family: 'UnifrakturMaguntia', serif; font-weight: 400; font-size: clamp(2.6rem, 8vw, 5.5rem); margin: 0; color: #e8d3a0; text-shadow: 0 0 30px rgba(255,140,50,0.35); }
  #overlay p { margin: 0; font-style: italic; opacity: 0.8; max-width: 34rem; line-height: 1.5; }
  #overlay .keys { font-style: normal; font-size: 0.95rem; opacity: 0.6; letter-spacing: 0.04em; }
  #overlay .enter { margin-top: 1rem; font-size: 1.2rem; letter-spacing: 0.3em; text-transform: uppercase; animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  #region { position: fixed; top: 12%; width: 100%; text-align: center; font-family: 'UnifrakturMaguntia', serif; font-size: clamp(1.8rem, 5vw, 3rem);
    color: #e6d2a2; opacity: 0; transition: opacity 2s; pointer-events: none; text-shadow: 0 0 20px #000, 0 0 40px rgba(255,120,40,0.25); }
  #region.show { opacity: 0.85; }
  #hint { position: fixed; bottom: 8%; width: 100%; text-align: center; font-style: italic; opacity: 0; transition: opacity 1.5s; pointer-events: none; }
  #hint.show { opacity: 0.7; }
</style>
</head>
<body>
<div id="overlay">
  <h1>Abbatia Nebularum</h1>
  <p>Anno Domini DCCXXVII. The fog has not lifted in forty days. Beyond the walls, the abbey keeps its silence, and beneath it, its dead.</p>
  <p class="keys">WASD to walk · Shift to hasten · Mouse to look · F for your lantern · Esc to pause</p>
  <p class="enter">The fog gathers…</p>
</div>
<div id="region"></div>
<div id="hint">It is dark. Press F to light your lantern.</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
